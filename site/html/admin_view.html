<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whitelist - admin_view :)</title>
    <link rel="stylesheet" href="../css/styles_admin_view.css">
</head>
<header id="en_tete">
    <img src="assets/img/logo_menu.svg" alt="le logo ecole" id="logo_menu">
    <div><h4 id="connection">Se connecter</h4></div>
</header>
<header id="titre_site"><h1>Whitelist</h1></header>
<body>
    <header>
        <label for="event"> <h3>Nom de l'événement </h3></label>
        <input type="text" id="event" name="event" placeholder="Nom de l'événement">
        <label for="date"> <h3>Date de l'événement </h3></label>
        <input type="date" id="date" name="date">
        <label for="time"> <h3>Heure de l'événement </h3></label>
        <input type="time" id="time" name="time">
        <label for="localisation"> <h3>Lieu de l'événement </h3></label>
        <input for="localisation" id="lieu" placeholder="Lieu de l'événement"></input>
         <label for="description"> <h3>Description de l'événement </h3></label>
        <textarea id="description" name="description" placeholder="Description de l'événement"></textarea>
        <label for="prix"> <h3>Prix de l'événement </h3></label>
        <input type="number" id="prix" name="prix" placeholder="Prix de l'événement">
        <form>
            <p><h3>Statut des places</h3></p>
            <input type="checkbox" id="Carré OR" name="statut_place">
            <label for="statut_place">Carré OR</label><br>
            <input type="checkbox" id="Gradins" name="statut_place">
            <label for="statut_place">Gradins</label><br>
            <input type="checkbox" id="Fosse" name="statut_place">
            <label for="statut_place">Fosse</label><br>
        </form>
        <label for="artiste"> <h3>Artiste de l'événement </h3></label>
        <input type="text" id="artiste" name="artiste" placeholder="Artiste de l'événement">
        <label for="places"> <h3>Nombre de places disponibles </h3></label>
        <input type="number" id="places" name="places" placeholder="Nombre de places disponibles">
        <label for="categorie"> <h3>Catégorie de l'événement </h3></label>
        <select id="categorie" name="categorie">
            <option value="concert">Concert</option>
            <option value="conference">Conférence</option>
            <option value="atelier">Atelier</option>
            <option value="spectacle">Spectacle</option>
        <label for="image"> <h3>Image de l'événement </h3></label>
        <input type="file" id="image" name="image">
        <button type="submit" id="submit">Créer l'événement</button>
    </header>
</body
</html>
